#
# This GitHub Actions workflow runs CodeQL analysis on the repository to detect
# security vulnerabilities, code quality issues, and potential weaknesses in the codebase.
#

name: CodeQL Report

on:
  workflow_dispatch:

jobs:
  code-ql:
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      #
      # Checks out the repository source code.
      #
      - name: Checkout source code
        uses: actions/checkout@v4

      #
      # Installs Java 25 and enables Maven dependency caching.
      #
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      #
      # Step 3: Initialize CodeQL analysis
      # This prepares the CodeQL database and configures the analysis for Java/Kotlin
      #
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin

      #
      # Builds the project and executes tests.
      # Test failures are ignored to allow report generation
      # to continue.
      #
      - name: Build with Maven
        run: mvn -B clean verify -Dspring.profiles.active=test

      #
      # Run CodeQL analysis and upload results to GitHub Security tab
      #
      - name: Analyse avec CodeQL
        uses: github/codeql-action/analyze@v4
