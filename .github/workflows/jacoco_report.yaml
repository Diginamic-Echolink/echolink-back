name: Jacoco report

on:
  workflow_dispatch:

jobs:
  jacoco:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Construire avec Maven
        run: mvn -B clean verify -Dspring.profiles.active=test

      - name: Publier le rapport JaCoCo
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/