#
# GitHub Actions workflow that generates the Maven site
# including the SpotBugs report and publishes it as a
# downloadable artifact.
#

name: SpotBugs Report

on:
  workflow_dispatch:

jobs:
  spotbugs:
    runs-on: ubuntu-latest

    steps:
      #
      # Checks out the repository source code.
      #
      - name: Checkout source code
        uses: actions/checkout@v4

      #
      # Installs Java 25 and enables Maven dependency caching.
      #
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      #
      # Builds the project and executes tests.
      # Test failures are ignored to allow report generation
      # to continue.
      #
      - name: Build project with Maven
        run: mvn -B clean verify -Dspring.profiles.active=test

      #
      # Generates the Maven site and all configured reports,
      # including the SpotBugs report.
      #
      - name: Generate Maven site
        run: mvn site

      #
      # Uploads the generated SpotBugs report directory
      # as a GitHub Actions artifact.
      #
      - name: Upload SpotBugs report
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: target/spotbugs/
