services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: echolink
    ports:
    - '25432:5432'
    volumes:
    - pgdata:/var/lib/postgresql
    env_file:
    - .env
    restart: on-failure
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME}" ]
      interval: 2s
      timeout: 2s
      retries: 5

volumes:
  pgdata: